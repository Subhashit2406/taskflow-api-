# ============================================================================
# TaskFlow API - Render Deployment Blueprint (Infrastructure as Code)
# ============================================================================

services:
  # Web Service (Node.js REST API)
  - type: web
    name: taskflow-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: API_KEY
        generateValue: true
      - key: ENABLE_CACHE
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

databases:
  # Managed PostgreSQL Database
  - name: taskflow-db
    plan: free
    region: oregon
    databaseName: taskflow_db
    user: taskflow_admin
    ipAllowList: [] # Allow all Render services within private network
